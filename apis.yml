  to the API Evangelist network for enrichment. Probing found the marketing site (www.vts.com) behind a bot
  challenge and a bare backend host (api.vts.com) with no publicly documented API program, OpenAPI, or developer
  portal; this remains a company profile rather than a documented API.'
